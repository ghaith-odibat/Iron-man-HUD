name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest -PversionCode=${{ github.run_number }}

      - name: Build release APK
        run: ./gradlew --stacktrace assembleRelease -PversionCode=${{ github.run_number }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/IronHUD.apk
          ls -la out

      - name: Upload HUD screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-screenshots
          path: app/build/hud-screenshots/
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronHUD-apk
          path: out/IronHUD.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Iron HUD v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/IronHUD.apk
            app/build/hud-screenshots/*.png
          body: |
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Install on your tablet:** download `IronHUD.apk` below, open it, and allow
            "Install unknown apps" for your browser/Files app when asked.
            Then tap VAULT and paste your free API keys — see
            [docs/GET_FREE_KEYS.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/GET_FREE_KEYS.md).
